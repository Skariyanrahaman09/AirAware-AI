name: AirAware AI CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Test Suite & Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Run Backend Test Suite (Jest & Supertest)
        run: npm --prefix server test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-32-chars-long-minimum

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Build Next.js Production Bundle
        run: npm --prefix client run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
